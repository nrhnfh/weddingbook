<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Buku Tamu Digital - Pernikahan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');
        .font-cursive { font-family: 'Great Vibes', cursive; }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-100 to-rose-200 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-cursive text-rose-700">Pernikahan</h1>
            <p class="text-gray-600 text-lg">Budi & Siti</p>
            <div class="w-24 h-0.5 bg-rose-300 mx-auto my-3"></div>
            <p class="text-sm text-gray-500">Scan QR Code di undangan Anda</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-4 mb-4">
            <div id="reader" style="width: 100%;"></div>
            <div class="text-center mt-3">
                <button onclick="startScanner()" class="bg-rose-500 text-white px-4 py-2 rounded-full text-sm hover:bg-rose-600">📷 Mulai Scan</button>
                <button onclick="stopScanner()" class="border border-gray-300 px-4 py-2 rounded-full text-sm ml-2">⏹️ Berhenti</button>
            </div>
        </div>

        <div id="statusCard" class="bg-white rounded-2xl shadow-xl p-6 hidden">
            <div id="statusIcon" class="text-center text-5xl mb-3"></div>
            <div id="statusMessage" class="text-center text-lg font-semibold"></div>
            <div id="detailInfo" class="mt-3 text-sm text-gray-600 text-center"></div>
        </div>

        <details class="mt-4 bg-white rounded-xl shadow p-4">
            <summary class="text-sm text-gray-500 cursor-pointer">🔑 Masukkan kode manual</summary>
            <div class="mt-3">
                <input type="text" id="manualCode" placeholder="Masukkan kode QR" class="w-full p-2 border rounded-lg mb-2">
                <button onclick="manualCheckin()" class="bg-gray-500 text-white px-4 py-2 rounded-lg text-sm w-full">Submit</button>
            </div>
        </details>

        <div class="text-center mt-6 text-xs text-gray-500">
            <span id="totalHadir">—</span> tamu sudah hadir
        </div>
    </div>

    <script>
        // >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
        // >>> GANTI URL INI DENGAN HASIL DEPLOY APPS SCRIPT ANDA <<<
        // >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyWfeH6O8u9axauc3Vifs16GBXS_FNSCF6EwSO7dF0ZfT_LPn1b8XuYzZDVCdqgOXmqvw/exec';
        
        let html5QrCode = null;
        
        async function sendToBackend(qrData) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'scan_tamu',
                        qr_code: qrData
                    })
                });
                
                const result = await response.json();
                showResult(result);
                
                if(result.success) {
                    updateCounter();
                }
            } catch(error) {
                showResult({
                    success: false,
                    message: 'Error koneksi: ' + error.message
                });
            }
        }
        
        function showResult(result) {
            const card = document.getElementById('statusCard');
            const icon = document.getElementById('statusIcon');
            const message = document.getElementById('statusMessage');
            const detail = document.getElementById('detailInfo');
            
            card.classList.remove('hidden');
            
            if(result.success) {
                icon.innerHTML = '🎉✨';
                message.innerHTML = result.message;
                message.className = 'text-center text-lg font-semibold text-green-600';
                if(result.data) {
                    detail.innerHTML = `
                        <div class="mt-2 p-3 bg-green-50 rounded-lg">
                            <p><strong>Meja:</strong> ${result.data.nomor_meja || '-'}</p>
                            <p><strong>Kategori:</strong> ${result.data.kategori || 'Umum'}</p>
                            <p class="text-xs mt-2">Terima kasih sudah datang! 💕</p>
                        </div>
                    `;
                }
            } else {
                icon.innerHTML = '😢❌';
                message.innerHTML = result.message;
                message.className = 'text-center text-lg font-semibold text-red-600';
                detail.innerHTML = '<p class="mt-2 text-xs">Silakan hubungi panitia di meja registrasi</p>';
            }
            
            setTimeout(() => {
                card.classList.add('hidden');
                if(html5QrCode) startScanner();
            }, 5000);
        }
        
        function startScanner() {
            if(html5QrCode) {
                html5QrCode.stop().then(() => initScanner());
            } else {
                initScanner();
            }
        }
        
        function initScanner() {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    stopScanner();
                    sendToBackend(decodedText);
                },
                (error) => {}
            ).catch(err => {
                document.getElementById('reader').innerHTML = '<div class="text-center p-4 text-red-500">Gagal akses kamera</div>';
            });
        }
        
        function stopScanner() {
            if(html5QrCode) html5QrCode.stop();
        }
        
        function manualCheckin() {
            const code = document.getElementById('manualCode').value;
            if(code) {
                sendToBackend(code);
                document.getElementById('manualCode').value = '';
            }
        }
        
        async function updateCounter() {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_kehadiran' })
                });
                const result = await response.json();
                if(result.success && result.data.kehadiran) {
                    document.getElementById('totalHadir').innerHTML = result.data.kehadiran.length;
                }
            } catch(e) {}
        }
        
        window.addEventListener('load', () => {
            startScanner();
            updateCounter();
            setInterval(updateCounter, 30000);
        });
    </script>
</body>
</html>
